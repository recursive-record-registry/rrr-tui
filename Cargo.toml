[package]
name = "rrr-tui"
version = "0.1.0"
edition = "2024"
description = "RRR TUI"
authors = ["Jakub Hlusička <Limeth@users.noreply.github.com>"]
build = "build.rs"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release-with-debug]
inherits = "release"
debug = true

[features]
default = []
opentelemetry = ["dep:opentelemetry", "opentelemetry-otlp", "tracing-opentelemetry", "opentelemetry_sdk"]
tracy = ["dep:tracing-tracy"]
debug = []

[dependencies]
# Feature opentelemetry
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry-otlp = { version = "0.33.1", optional = true }
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"], optional = true }
tracing-opentelemetry = { version = "0.34.0", optional = true }

# Feature tracy
tracing-tracy = { version = "0.12.0", optional = true }

accesskit = "0.25.2"
better-panic = "0.3.0"
clap = { version = "4.6", features = [
    "derive",
    "cargo",
    "wrap_help",
    "unicode",
    "string",
    "unstable-styles",
] }
color-eyre = "0.6.5"
config = "0.15.27"
crossterm = { version = "0.29.0", features = ["serde", "event-stream"] }
derive_deref = "1.1.1"
directories = "6.0"
easing-function = "0.1.1"
futures = "0.3.34"
human-panic = "2.0.8"
itertools = "0.15.0"
json5 = "1.3.7"
kolor = "0.1.9"
konst = "0.4.3"
lazy_static = "1.5.1"
libc = "0.2.191"
nalgebra = "0.35.0"
num-traits = "0.2.19"
polonius-the-crab = "0.6.0"
pretty_assertions = "1.4.1"
ratatui = { version = "0.30.2", features = ["serde", "macros", "unstable-widget-ref"] }
rrr = { git = "https://github.com/recursive-record-registry/rrr.git", rev = "8c847bf0763d947acd7f8026024d358c5b8b9415" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
simba = "0.10.2"
static_assertions = "1.1.0"
strip-ansi-escapes = "0.2.1"
strum = { version = "0.28.0", features = ["derive"] }
taffy = "0.15.1"
textwrap = "0.16.4"
tokio = { version = "1.54", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "serde"] }

[build-dependencies]
anyhow = "1.0.104"
vergen-gix = { version = "10.0.3", features = ["build", "cargo"] }
